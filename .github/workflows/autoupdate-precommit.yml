# .github/workflows/autoupdate-precommit.yml
name: Update pre-commit hooks

on:
  schedule:
    - cron: '0 0 1 * *'  # 毎月1日 00:00 UTC
  workflow_dispatch:      # 手動実行可能

permissions: {}

jobs:
  verify:
    name: Verify updated hooks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      verified_base_sha: ${{ steps.checkout.outputs.commit }}
      changed: ${{ steps.git-check.outputs.changed }}

    steps:
      - name: Checkout code
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Update pre-commit hooks
        run: |
          pip install pre-commit
          pre-commit autoupdate --freeze

      # gitleaksインストール（pre-commit language: system用）
      # NOTE: .pre-commit-config.yamlでlanguage: systemを使用しているため
      # CI環境では明示的にgitleaksバイナリをインストールする必要がある
      # gh CLIで最新版を動的取得（手動更新不要、認証済みでRate Limit緩和）
      - name: Install gitleaks (latest)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TEMP_DIR=$(mktemp -d)
          cd "$TEMP_DIR"
          gh release download --repo gitleaks/gitleaks --pattern "gitleaks_*_linux_x64.tar.gz" --clobber
          tar -xzf gitleaks_*_linux_x64.tar.gz
          sudo mv gitleaks /usr/local/bin/
          gitleaks version
          rm -rf "$TEMP_DIR"

      # Fail Fast: 壊れたフックでPR作成を防止（早期検出でデバッグ時間節約）
      - name: Verify updated hooks
        run: pre-commit run --all-files
        continue-on-error: false

      - name: Check for changes
        id: git-check
        shell: bash
        run: |
          set -euo pipefail
          changed_paths=$(git diff --name-only)
          name_status=$(git diff --name-status)

          case "$changed_paths" in
            '')
              echo "changed=false" >> "$GITHUB_OUTPUT"
              ;;
            .pre-commit-config.yaml)
              echo "changed=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::Unexpected changed path(s): $changed_paths" >&2
              exit 1
              ;;
          esac

          if [[ -n "$name_status" ]]; then
            while IFS=$'\t' read -r status path extra; do
              if [[ "$status" != M || "$path" != .pre-commit-config.yaml || -n "$extra" || -d "$path" ]]; then
                echo "::error::Unexpected diff entry: $status $path $extra" >&2
                exit 1
              fi
            done <<< "$name_status"
          fi

      - name: Upload verified pre-commit config
        if: steps.git-check.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-precommit-config
          path: .pre-commit-config.yaml
          include-hidden-files: true
          if-no-files-found: error

  write:
    name: Create pull request
    needs: verify
    if: needs.verify.result == 'success' && needs.verify.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.verified_base_sha }}

      - name: Download verified pre-commit config
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-precommit-config
          path: .artifact/verified-precommit-config

      - name: Restore verified pre-commit config
        run: |
          test -f .artifact/verified-precommit-config/.pre-commit-config.yaml
          cp -- .artifact/verified-precommit-config/.pre-commit-config.yaml .pre-commit-config.yaml

      - name: Check for restored changes
        id: git-check
        shell: bash
        run: |
          set -euo pipefail
          changed_paths=$(git diff --name-only)
          name_status=$(git diff --name-status)

          case "$changed_paths" in
            '')
              echo "changed=false" >> "$GITHUB_OUTPUT"
              ;;
            .pre-commit-config.yaml)
              echo "changed=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::Unexpected changed path(s): $changed_paths" >&2
              exit 1
              ;;
          esac

          if [[ -n "$name_status" ]]; then
            while IFS=$'\t' read -r status path extra; do
              if [[ "$status" != M || "$path" != .pre-commit-config.yaml || -n "$extra" || -d "$path" ]]; then
                echo "::error::Unexpected diff entry: $status $path $extra" >&2
                exit 1
              fi
            done <<< "$name_status"
          fi

      - name: Create Pull Request
        id: create-pr
        if: steps.git-check.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(deps): update pre-commit hooks"
          title: "chore(deps): update pre-commit hooks"
          body: |
            ## Automated pre-commit hooks update
            
            Updated by `pre-commit autoupdate --freeze`.
            
            ### Verification
            ```bash
            pre-commit run --all-files
            ```
          branch: chore/update-precommit-hooks
          base: develop
          labels: |
            dependencies
            pre-commit
          delete-branch: true
          add-paths: .pre-commit-config.yaml

      - name: Verify pull request output
        if: steps.git-check.outputs.changed == 'true'
        env:
          PULL_REQUEST_OPERATION: ${{ steps.create-pr.outputs.pull-request-operation }}
          PULL_REQUEST_URL: ${{ steps.create-pr.outputs.pull-request-url }}
        run: |
          case "$PULL_REQUEST_OPERATION" in
            created|updated)
              if [ -z "$PULL_REQUEST_URL" ]; then
                echo "::error::pull-request-operation='${PULL_REQUEST_OPERATION}' but pull-request-url is empty" >&2
                exit 1
              fi
              echo "Pull request ${PULL_REQUEST_OPERATION}: ${PULL_REQUEST_URL}"
              ;;
            closed)
              echo "::error::Create Pull Request step closed the pull request (url=${PULL_REQUEST_URL})" >&2
              exit 1
              ;;
            none)
              echo "Create Pull Request step reported no pull request changes (operation=none)"
              exit 0
              ;;
            "")
              echo "::error::Create Pull Request step did not produce pull-request-operation output (step may have failed)" >&2
              exit 1
              ;;
            *)
              echo "::error::Unexpected pull-request-operation value: '${PULL_REQUEST_OPERATION}'" >&2
              exit 1
              ;;
          esac
